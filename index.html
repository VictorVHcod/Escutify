<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escutify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-esquerda">
      <a href="#inicio" id="nav-inicio" class="logo">Escutify</a>
      <button type="button" id="btn-inicio" class="nav-btn">Início</button>
      <button type="button" id="btn-albuns" class="nav-btn">Álbuns</button>
      <button type="button" id="btn-cadastrar" class="nav-btn">Cadastrar</button>

      <div class="barra-pesquisa">
        <input
          type="text"
          id="input-pesquisa"
          placeholder="O que você quer ouvir?"
          aria-label="Pesquisar músicas ou álbuns"
        />
      </div>
    </div>

    <div class="navbar-direita">
      <button type="button" id="btn-inscrever" class="btn-secundario">Inscrever-se</button>
      <button type="button" id="btn-logar" class="btn-primario">Entrar</button>
    </div>
  </header>
</body>
</html>
